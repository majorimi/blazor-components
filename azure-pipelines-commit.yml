# ASP.NET Core
# Build and test ASP.NET Core projects targeting .NET Core.
# Add steps that run tests, create a NuGet package, deploy, and more:
# https://docs.microsoft.com/azure/devops/pipelines/languages/dotnet-core

trigger:
  batch: true
  branches:
    include:
    - '*'
  paths:
    include:
    - src/*

name: 1.0.0.$(rev:r)

pool:
  vmImage: 'ubuntu-latest'

variables:
  solution: 'src/Majorsoft.Blazor.Components.sln'
  buildPlatform: 'Any CPU'
  buildConfiguration: 'Release'

jobs:
  - job: BuildAndPublish
    displayName: Commit check Build
    steps:
    
    - task: UseDotNet@2
      displayName: Install .NET 10
      inputs:
       packageType: 'sdk'
       version: '10.0.x' # replace this value with the version that you need for your project

    - task: DotNetCoreCLI@2
      displayName: 'dotnet restore packages'
      inputs:
        command: 'restore'
        projects: '$(solution)'
        feedsToUse: 'select'

    - task: DotNetCoreCLI@2
      displayName: 'dotnet build'
      inputs:
        command: 'build'
        projects: '$(solution)'
        arguments: '--configuration $(buildConfiguration)'

    - task: DotNetCoreCLI@2
      displayName: 'run tests'
      continueOnError: true
      inputs:
        command: 'test'
        projects: '**/*.Tests.csproj'
        arguments: '--configuration $(buildConfiguration)'