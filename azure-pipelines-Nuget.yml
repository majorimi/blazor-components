# ASP.NET Core
# Build and test ASP.NET Core projects targeting .NET Core.
# Add steps that run tests, create a NuGet package, deploy, and more:
# https://docs.microsoft.com/azure/devops/pipelines/languages/dotnet-core

trigger: none
pr: none

name: 'Nuget packages $(AssemblyVersion)$(PreviewPackageVersion)'

pool:
  vmImage: 'ubuntu-latest'

variables:
  solution: 'src/Majorsoft.Blazor.Components.sln'
  buildPlatform: 'Any CPU'
  buildConfiguration: 'Release'
  AssemblyCompany: 'Majorsoft'
  AssemblyAuthor: 'Imre Toth'
  AssemblyProduct: 'Majorsoft Blazor Components'
  AssemblyCopyright: 'Copyright ©2026 Majorsoft'
  AssemblyVersion: '${{ parameters.AssemblyVersion }}'
  PreviewPackageVersion: '${{ parameters.PreviewPackageVersion }}'
  empty: ""

parameters:
- name: AssemblyVersion
  displayName: 'Required Nuget package version e.g. "2.0.0"'
  type: string
  default: ''
- name: PreviewPackageVersion
  displayName: 'Optional Preview version e.g. "-rc.2.0.0"'
  type: string
  default: $(empty)

jobs:
  - job: BuildAndPublish
    displayName: Package Nuget
    steps:

    - task: UseDotNet@2
      displayName: Install .NET 10
      inputs:
       packageType: 'sdk'
       version: '10.0.x' # replace this value with the version that you need for your project

    - task: Assembly-Info-NetCore@2
      displayName: 'Update Web Assembly Info'
      inputs:
        Path: '$(Build.SourcesDirectory)'
        FileNames: 'src/**/*.csproj'
        InsertAttributes: true
        FileEncoding: 'auto'
        WriteBOM: false
        Authors: '$(AssemblyAuthor)'
        Company: '$(AssemblyCompany)'
        Product: '$(AssemblyProduct)'
        Description: 'Blazor Components by Imre Toth'
        Copyright: '$(AssemblyCopyright)'
        RepositoryType: 'Git'
        VersionNumber: '$(AssemblyVersion)$(PreviewPackageVersion)'
        FileVersionNumber: '$(AssemblyVersion)$(PreviewPackageVersion)'
        InformationalVersion: '$(AssemblyVersion)$(PreviewPackageVersion)'
        PackageVersion: '$(AssemblyVersion)$(PreviewPackageVersion)'
        GeneratePackageOnBuild: false
        LogLevel: 'verbose'
        FailOnWarning: false
        DisableTelemetry: false

    - task: DotNetCoreCLI@2
      displayName: 'dotnet restore packages'
      inputs:
        azureSubscription: '8b3s(ccf8dfff-5ba9-4caf-848c-6ff133c46088)'
        command: 'restore'
        projects: '$(solution)'
        feedsToUse: 'select'
        vstsFeed: '4f8b1f2e-37e5-4c51-b721-13f56be6a30d'

    - task: DotNetCoreCLI@2
      displayName: 'dotnet build'
      inputs:
        command: 'build'
        projects: '$(solution)'
        arguments: '--configuration $(buildConfiguration)'

    - task: DotNetCoreCLI@2
      displayName: 'run tests'
      continueOnError: true
      inputs:
       command: 'test'
       projects: '**/*.Tests.csproj'
       arguments: '--configuration $(buildConfiguration)'

    - task: DotNetCoreCLI@2
      displayName: 'dotnet pack'
      inputs:
        command: 'pack'
        packagesToPack: 'src/**/*.csproj;!**/*.Test[s].csproj;!**/*Test*.csproj;!**/*Demo*.csproj'
        configuration: '$(buildConfiguration)'
        packDirectory: '$(Build.ArtifactStagingDirectory)/nupkgs'
        nobuild: true
        #includesymbols: true
        versioningScheme: 'off'

    # - task: PowerShell@2
    #   displayName: Create Nuget packages
    #   inputs:
    #     targetType: 'inline'
    #     script: |
    #       $version = '$(AssemblyVersion)' + '$(PreviewPackageVersion)'
    #       $config = '$(buildConfiguration)'
    #       $out = '$(Build.ArtifactStagingDirectory)/nupkgs'
    #       Write-Host $version
    #       #$newVersion = "<Version>" + $version + "<`/Version>"
    #       #Write-Host $newVersion
    #       $verRegex = '<Version>.*'
    #       # $nugetRegex = '(<PackageReference\s+Include="Majorsoft\.Blazor\..* Version=")([rc0-9\.-]*)(".*)'
    #       Get-ChildItem -Path src/**/*.csproj | % {
    #         $file = $_.FullName
    #         Write-Host $file
    #         if((Get-Content -path $file -Raw) -match $verRegex) {
    #             dotnet pack $file --configuration $config --output $out -p:PackageVersion=$version
    #         }
    #         #(Get-Content -path $file -Raw) -replace $verRegex, $newVersion | Set-Content -Path $file
    #         #(Get-Content -path $file -Raw) -replace $nugetRegex, "`${1}$version`${3}" | Set-Content -Path $file
    #       }

    - task: PublishBuildArtifacts@1
      displayName: 'Publish Nugets'
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)/nupkgs/'
        ArtifactName: 'nuget'
        publishLocation: 'Container'

    - task: DotNetCoreCLI@2
      displayName: 'dotnet upload Nuget'
      inputs:
        command: 'push'
        packagesToPush: '$(Build.ArtifactStagingDirectory)/nupkgs/*.nupkg'
        nuGetFeedType: 'internal'
        publishVstsFeed: '4f8b1f2e-37e5-4c51-b721-13f56be6a30d'
